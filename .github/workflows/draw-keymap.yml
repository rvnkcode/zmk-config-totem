name: Draw ZMK keymap

# Draws every layer on one keyboard image (Miryoku style) into keymap-drawer/totem.svg
# and commits it back to the branch.
on:
  workflow_dispatch:
  push:
    paths:
      - "config/**/*.keymap"
      - ".github/workflows/draw-keymap.yml"
      - "keymap_drawer.config.yaml"
      - "scripts/merge_layers.py"

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install keymap-drawer
        run: pip install keymap-drawer==0.23.0

      - name: Draw keymap
        run: |
          keymap -c keymap_drawer.config.yaml parse -z config/totem.keymap > "$RUNNER_TEMP/totem.yaml"
          python scripts/merge_layers.py "$RUNNER_TEMP/totem.yaml" "$RUNNER_TEMP/totem_merged.yaml"
          mkdir -p keymap-drawer
          keymap -c keymap_drawer.config.yaml draw "$RUNNER_TEMP/totem_merged.yaml" > keymap-drawer/totem.svg

      - name: Commit drawing
        run: |
          git add keymap-drawer/totem.svg
          if git diff --cached --quiet; then
            echo "Drawing unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: update keymap drawing"
          git push
